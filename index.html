<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Ace Stream Hub (Canlı)</title>
    <style>
        :root { --primary: #00e676; --accent: #ff6600; --search: #2196F3; --dark: #121212; --card: #1e1e1e; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--dark); color: white; padding: 20px; }
        .container { max-width: 650px; margin: auto; }
        .header-panel { background: var(--card); padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #333; margin-bottom: 20px; }
        .button-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 15px; }
        .nav-link { flex: 1; min-width: 140px; color: white; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-cast { background: var(--accent); }
        .btn-search { background: var(--search); }
        .search-box { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #252525; color: white; box-sizing: border-box; margin-top: 10px; }
        .channel-list { margin-top: 10px; }
        .channel-item { background: var(--card); padding: 15px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2a2a2a; }
        .btn-copy { background: var(--primary); color: #000; border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .status-msg { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--primary); color: black; padding: 10px 30px; border-radius: 20px; font-weight: bold; display: none; z-index: 100; }
        #loading { text-align: center; color: var(--primary); margin: 20px 0; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-panel">
        <div class="button-group">
            <a href="https://acestream.me/cast" target="_blank" class="nav-link btn-cast">📺 TV'ye Gönder</a>
            <a href="https://search-ace.stream/" target="_blank" class="nav-link btn-search">🔍 Kanal Ara</a>
        </div>
        <input type="text" id="searchInput" class="placeholder" style="width:100%; padding:10px; background:#252525; color:white; border:1px solid #444; border-radius:8px;" placeholder="Listede ara...">
    </div>

    <div id="loading">📡 Veriler çekiliyor...</div>
    <div id="channelList" class="channel-list"></div>
</div>

<div id="status" class="status-msg">Kopyalandı!</div>

<script>
    // Sizin verdiğiniz CSV linki
    const BASE_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRyMIf3ixlQh-8UTTPtNSZqX75SVI08-r9XwcuFdOZSkyAzThq0b5h36okh5A3L_JlsDH-xtrfM8bJw/pub?output=csv';

    let channels = [];

    async function loadData() {
        try {
            // Önbelleği aşmak için sonuna rastgele bir sayı ekliyoruz
            const fetchUrl = `${BASE_URL}&cachebuster=${new Date().getTime()}`;
            const response = await fetch(fetchUrl);
            
            if (!response.ok) throw new Error('Ağ yanıtı düzgün değil');

            const data = await response.text();
            
            // Satırları ayır ve başlığı atla
            const rows = data.split(/\r?\n/).slice(1); 
            
            channels = rows.map(row => {
                // CSV'deki virgülleri ayırırken dikkatli oluyoruz
                const parts = row.split(',');
                if (parts.length >= 2) {
                    return { name: parts[0].trim(), id: parts[1].trim() };
                }
                return null;
            }).filter(item => item && item.name && item.id);

            document.getElementById('loading').style.display = 'none';
            renderChannels();
        } catch (error) {
            console.error('Hata detayı:', error);
            document.getElementById('loading').innerHTML = 
                `<span style="color:red;">Hata: Veri çekilemedi!</span><br>
                <small style="color:#888;">Lütfen GitHub Pages üzerinden veya bir sunucuda deneyin.</small>`;
        }
    }

    function renderChannels(filter = "") {
        const list = document.getElementById('channelList');
        list.innerHTML = "";
        
        const filtered = channels.filter(c => c.name.toLowerCase().includes(filter.toLowerCase()));
        
        if (filtered.length === 0 && channels.length > 0) {
            list.innerHTML = '<p style="text-align:center; color:#666;">Kanal bulunamadı.</p>';
        }

        filtered.forEach(ch => {
            const div = document.createElement('div');
            div.className = 'channel-item';
            div.innerHTML = `
                <span style="font-weight:bold;">${ch.name}</span>
                <button class="btn-copy" onclick="copyId('${ch.id}')">Kopyala</button>
            `;
            list.appendChild(div);
        });
    }

    function copyId(id) {
        navigator.clipboard.writeText(id).then(() => {
            const status = document.getElementById('status');
            status.style.display = 'block';
            setTimeout(() => status.style.display = 'none', 1500);
        });
    }

    document.getElementById('searchInput').addEventListener('input', (e) => renderChannels(e.target.value));

    // Sayfa yüklendiğinde veriyi çek
    loadData();
</script>
</body>
</html>
